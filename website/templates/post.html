{% extends "base.html" %} {% block title %}Blog{% endblock %} {% block content
%}
<div class="mx-auto max-w-3xl px-4 sm:px-6 xl:max-w-5xl xl:px-0">
  <div class="space-y-1 border-b border-gray-200 pb-10 text-center ">
    <h1 class="text-3xl font-extrabold leading-9 tracking-tight text-gray-900 sm:text-4xl sm:leading-10 md:text-5xl md:leading-14">
      {{ post['title'] }}
    </h1>
  </div>
  <img src="{{ url_for('static', filename='img/articles/'+post['image']) }}" class="w-full">
  <article>
    {{ post['description'] | safe }}
  </article>
</div>
<section class="bg-gray-900 flex flex-col pt-14 items-center">
  <div class="mb-4">
    <img src="{{ url_for('static', filename='img/logo1.png') }}" alt="Logo" class="h-10 w-10">
  </div>
  <div class="text-white text-center font-montserrat text-sm">
    © 2022 Weather Data <br> Author: Morar Alexandru-Flavius.<br>
    All rights reserved
  </div>
</section>
{% endblock %}
