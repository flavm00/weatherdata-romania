{% extends "base.html" %} {% block title %}Contact{% endblock %} {% block content
%}
<div class="mx-auto max-w-3xl px-4 sm:px-6 xl:max-w-5xl xl:px-0">
    <div class="space-y-2 pt-6 pb-8 md:space-y-5">
      <h2 class="text-3xl font-extrabold leading-9 tracking-tight text-black sm:text-4xl sm:leading-10 md:text-6xl md:leading-14">Contact</h2>
      <p class="text-lg leading-7 text-gray-500 ">
        Oferă o sugestie despre ce ai vrea să afli mai departe!
      </p>
    </div>
    <div class="container max-w-full mx-auto px-6">
        <div class="font-sans">
            <div class="max-w-sm mx-auto px-6">
                <div class="relative flex flex-wrap">
                    <div class="w-full relative">
                        <div class="mt-6">
                            <form class="mt-8" method="POST">
                                <div class="mx-auto max-w-lg">
                                    <div class="py-2">
                                        <span class="px-1 text-sm text-gray-600">Nume complet</span>
                                        <input placeholder="" type="text" , name="name" class="text-md block px-3 py-2  rounded-lg w-full bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md focus:placeholder-gray-500 focus:bg-white focus:border-gray-600 focus:outline-none">
                                    </div>
                                    <div class="py-2">
                                        <span class="px-1 text-sm text-gray-600">Completează aici</span>
                                        <div class="relative">
                                            <textarea placeholder="" type="textarea" name="form_desc" rows="10" class="text-md block px-3 py-2 rounded-lg w-full
                        bg-white border-2 border-gray-300 placeholder-gray-600 shadow-md
                        focus:placeholder-gray-500
                        focus:bg-white
                        focus:border-gray-600
                        focus:outline-none"></textarea>
                                        </div>
                                    </div>
                                    <div class="flex justify-between">
                                        <label class="block text-gray-500 font-bold my-4">


                                    </div> <button class=" mb-8 mt-3 text-lg font-semibold
                        bg-gray-800 w-full text-white rounded-lg
                        px-6 py-3 block shadow-xl hover:text-white hover:bg-black">
                                        Trimite
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<section class="bg-gray-900 flex flex-col pt-14 items-center">
    <div class="mb-4">
        <img src="{{ url_for('static', filename='img/logo1.png') }}" alt="Logo" class="h-10 w-10">
    </div>
    <div class="text-white text-center font-montserrat text-sm">
        © 2022 Weather Data <br> Author: Morar Alexandru-Flavius.<br>
        All rights reserved
    </div>
</section>
{% endblock %}
