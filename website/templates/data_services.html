{% extends "base.html" %} {% block title %}Data services{% endblock %} {% block content
%}
<div class="mx-auto max-w-3xl px-4 sm:px-6 xl:max-w-5xl xl:px-0">
    <div class="space-y-2 pt-6 pb-8 md:space-y-5">
      <h2 class="text-3xl font-extrabold leading-9 tracking-tight text-black sm:text-4xl sm:leading-10 md:text-6xl md:leading-14">Statistici</h2>
      <p class="text-lg leading-7 text-gray-500 ">
        Vizualizează tendinţa climei şi statistici despre fiecare judeţ în parte.
      </p>
    </div>
    <div class="mt-2 p-8 text-center">
      <img src="{{ url_for('static', filename='img/output.png') }}" class="w-full">
    </div>

    <div class="grid md:grid-cols-2 gap-2 sm:grid-cols-1">
    {% for co in county %}
      <canvas id="chart-{{co.id}}" width="400" height="300"></canvas>
      <script>
      // draw line chart
      new Chart(document.getElementById("chart-{{co.id}}").getContext("2d"), {
        type: 'line',
        data: {
          labels : [
            {{ data | selectattr('area', '==', co.area) | map(attribute='year') | join(', ') }}
          ],
          datasets : [{
            label: "{{co.area}}",
            borderColor: "#3e95cd",
            borderWidth: 1,
            data : [
              {{ data | selectattr('area', '==', co.area) | map(attribute='temp') | join(', ') }}
            ]
          }]
        },
        options: {
          responsive: false,
          interaction: {
            intersect: false,
          },
          scales: {
            x: {
              display: true,
              title: {
                display: true
              }
            },
            y: {
              display: true,
              title: {
                display: true,
                text: 'Temperatura in grade C'
              },
              suggestedMin: 5,
              suggestedMax: 12
            }
          }
        },
      }
    );
    </script>
    
  {% endfor %}
  </div>
{% endblock %}
